; config.ini の見本。コピーして config.ini にして、変えたい行のコメント (先頭の ;) を外す。
; config.ini は PHP として実行されない。キー・型・範囲を検査して、外れた値は無視して既定値を使う (理由は error_log に出る)。
; 文字列は "" で囲んでも囲まなくてもよい (< > " ' & $ \ と制御文字は使えない)。真偽は true / false。

; 同じ板での連投制限 (秒) 0〜3600
;POST_INTERVAL = 5
; 同じ IP の新規スレッド作成の間隔 (秒) 0〜86400
;GLOBAL_WINDOW = 180
; これを超えた古いスレッドは o数字.html に退避 (0 なら退避しない) 0〜100000
;MAX_THREADS = 200
; 「次のページ」のファイルを再利用する秒数 0〜3600
;PAGE_CACHE = 10

; 入力の上限
;MAX_POST_BYTES = 7500
;SUBJ_MAX = 45
;NAME_MAX = 25
;MAIL_MAX = 50
;COMM_MAX = 400
;COMM_LINES_MAX = 20

; 板のタイトルの後ろに付く名前 (40文字まで) と、管理者名 (1〜20文字)
;AMEZO = ＠あめぞう
;ADMIN = サポート
;URLBASE = http://ame.x0.com/

; 投稿の URL を、署名つきの中継ページ (jump.cgi) 経由のリンクにする。false なら直リンク
;JUMP_ENABLED = true

; X-Forwarded-For / CF-Connecting-IP を信用する接続元 (cloudflared など、手前のプロキシの IP)
;TRUSTED_PROXIES[] = 127.0.0.1
;TRUSTED_PROXIES[] = ::1
; どのプロキシも信用しないなら、値を空にする
;TRUSTED_PROXIES =

; パスワードハッシュの反復回数 (新しく作るハッシュにだけ効く。既存のハッシュは、保存された回数で検証する)
;HASH_ITERATIONS = 100000
